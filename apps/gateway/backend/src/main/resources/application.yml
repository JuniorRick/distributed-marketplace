server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8090/realms/marketplace}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8090/realms/marketplace/protocol/openid-connect/certs}
          audiences: marketplace-api
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog-api
              uri: ${CATALOG_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/api/catalog/**
              filters:
                - RewritePath=/api/catalog/?(?<segment>.*), /api/$\{segment}
            - id: cart-api
              uri: ${CART_BASE_URL:http://localhost:8082}
              predicates:
                - Path=/api/carts/**
            - id: orders-api
              uri: ${ORDERS_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/api/orders/**
            - id: customers-api
              uri: ${CUSTOMERS_BASE_URL:http://localhost:8087}
              predicates:
                - Path=/api/customers/**
            - id: catalog-ui
              uri: ${CATALOG_UI_BASE_URL:http://localhost:5173}
              predicates:
                - Path=/catalog/**
              filters:
                - RewritePath=/catalog/?(?<segment>.*), /$\{segment}
            - id: cart-ui
              uri: ${CART_UI_BASE_URL:http://localhost:5174}
              predicates:
                - Path=/cart/**
              filters:
                - RewritePath=/cart/?(?<segment>.*), /$\{segment}
            - id: orders-ui
              uri: ${ORDERS_UI_BASE_URL:http://localhost:5175}
              predicates:
                - Path=/orders/**
              filters:
                - RewritePath=/orders/?(?<segment>.*), /$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: 1.0.0
      deployment.environment.name: local
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 5s
