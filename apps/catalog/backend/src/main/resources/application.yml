server:
  port: ${PORT:8081}

spring:
  application:
    name: catalog
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5433/marketplace?currentSchema=catalog}
    username: ${CATALOG_DB_USER:marketplace}
    password: ${CATALOG_DB_PASSWORD:marketplace}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: catalog
    liquibase-schema: catalog
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-availability-projection-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      observation-enabled: true

catalog:
  cors:
    allowed-origins: ${CATALOG_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: 1.0.0
      deployment.environment.name: local
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 5s
logging:
  level:
    root: info
    com.learningspringboot4: info
  structured:
    format:
      console: logstash
