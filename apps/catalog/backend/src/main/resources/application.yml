server:
  port: ${PORT:8081}

spring:
  application:
    name: catalog
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5433/marketplace?currentSchema=catalog}
    username: ${CATALOG_DB_USER:marketplace}
    password: ${CATALOG_DB_PASSWORD:marketplace}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: catalog
    liquibase-schema: catalog
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-availability-projection-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

catalog:
  cors:
    allowed-origins: ${CATALOG_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
