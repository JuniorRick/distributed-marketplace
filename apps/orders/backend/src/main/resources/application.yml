server:
  port: ${PORT:8083}

spring:
  application:
    name: orders
  datasource:
    url: ${ORDERS_DB_URL:jdbc:postgresql://localhost:5433/marketplace?currentSchema=orders}
    username: ${ORDERS_DB_USER:marketplace}
    password: ${ORDERS_DB_PASSWORD:marketplace}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: orders
    liquibase-schema: orders
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:marketplace}
    password: ${RABBITMQ_PASSWORD:marketplace}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        default-requeue-rejected: false
        observation-enabled: true
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-retries: 5

cart:
  base-url: ${CART_BASE_URL:http://localhost:8082}

marketplace:
  outbox:
    fixed-delay: ${OUTBOX_FIXED_DELAY:1s}
  saga:
    reconciliation:
      initial-delay: ${SAGA_RECONCILIATION_INITIAL_DELAY:30s}
      fixed-delay: ${SAGA_RECONCILIATION_FIXED_DELAY:30s}
      stale-after: ${SAGA_RECONCILIATION_STALE_AFTER:1m}
      max-attempts: ${SAGA_RECONCILIATION_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: 1.0.0
      deployment.environment.name: local
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 5s
logging:
  level:
    root: info
    com.learningspringboot4: info
  structured:
    format:
      console: logstash
