server:
  port: ${PORT:8083}

spring:
  application:
    name: orders
  datasource:
    url: ${ORDERS_DB_URL:jdbc:postgresql://localhost:5433/marketplace?currentSchema=orders}
    username: ${ORDERS_DB_USER:marketplace}
    password: ${ORDERS_DB_PASSWORD:marketplace}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: orders
    liquibase-schema: orders
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:marketplace}
    password: ${RABBITMQ_PASSWORD:marketplace}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-retries: 5

cart:
  base-url: ${CART_BASE_URL:http://localhost:8082}

marketplace:
  outbox:
    fixed-delay: ${OUTBOX_FIXED_DELAY:1s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
