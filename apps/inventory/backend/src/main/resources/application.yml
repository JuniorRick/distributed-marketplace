server:
  port: ${PORT:8084}

spring:
  application:
    name: inventory
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5433/marketplace?currentSchema=inventory}
    username: ${INVENTORY_DB_USER:marketplace}
    password: ${INVENTORY_DB_PASSWORD:marketplace}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: inventory
    liquibase-schema: inventory
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:marketplace}
    password: ${RABBITMQ_PASSWORD:marketplace}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-retries: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        compression.type: zstd
        delivery.timeout.ms: 120000
marketplace:
  outbox:
    fixed-delay: ${OUTBOX_FIXED_DELAY:1s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
