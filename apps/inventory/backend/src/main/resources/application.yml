server:
  port: ${PORT:8084}

spring:
  application:
    name: inventory
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5433/marketplace?currentSchema=inventory}
    username: ${INVENTORY_DB_USER:marketplace}
    password: ${INVENTORY_DB_PASSWORD:marketplace}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: inventory
    liquibase-schema: inventory
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:marketplace}
    password: ${RABBITMQ_PASSWORD:marketplace}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        default-requeue-rejected: false
        observation-enabled: true
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-retries: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        compression.type: zstd
        delivery.timeout.ms: 120000
    template:
      observation-enabled: true

marketplace:
  outbox:
    fixed-delay: ${OUTBOX_FIXED_DELAY:1s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: 1.0.0
      deployment.environment.name: local
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 5s
logging:
  level:
    root: info
  structured:
    format:
      console: logstash
