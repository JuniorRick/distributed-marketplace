server:
  port: ${PORT:8085}

spring:
  application:
    name: payments
  datasource:
    url: ${PAYMENTS_DB_URL:jdbc:postgresql://localhost:5433/marketplace?currentSchema=payments}
    username: ${PAYMENTS_DB_USER:marketplace}
    password: ${PAYMENTS_DB_PASSWORD:marketplace}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: payments
    liquibase-schema: payments
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:marketplace}
    password: ${RABBITMQ_PASSWORD:marketplace}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-retries: 5

marketplace:
  payment:
    simulator-outcome: ${PAYMENT_SIMULATOR_OUTCOME:CAPTURED}
  outbox:
    fixed-delay: ${OUTBOX_FIXED_DELAY:1s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
