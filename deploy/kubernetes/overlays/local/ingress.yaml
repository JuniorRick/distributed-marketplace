apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketplace
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /api/carts
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /api/customers/me
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /cart
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
