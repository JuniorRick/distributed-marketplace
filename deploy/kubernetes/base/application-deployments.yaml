apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: cart
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cart
          image: marketplace/cart:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: marketplace-runtime
            - secretRef:
                name: marketplace-rabbitmq-runtime
          env:
            - name: CART_DB_URL
              value: jdbc:postgresql://marketplace-db:5432/marketplace?currentSchema=cart
            - name: CART_DB_USER
              valueFrom:
                secretKeyRef:
                  name: marketplace-db-credentials
                  key: username
            - name: CART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketplace-db-credentials
                  key: password
            - name: CATALOG_BASE_URL
              value: http://catalog:8081
            - name: CART_CORS_ALLOWED_ORIGINS
              value: http://localhost:8088
            - name: CART_SECURITY_ENABLED
              value: "true"
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
