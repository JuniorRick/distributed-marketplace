apiVersion: v1
kind: ServiceAccount
metadata:
  name: cart-frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: cart-frontend
  labels:
    app.kubernetes.io/name: cart-frontend
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: cart-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: orders-frontend
  labels:
    app.kubernetes.io/name: orders-frontend
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: orders-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-frontend
  labels:
    app.kubernetes.io/name: cart-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: cart-frontend
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cart-frontend
          image: marketplace/cart-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-frontend
  labels:
    app.kubernetes.io/name: orders-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: orders-frontend
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: orders-frontend
          image: marketplace/orders-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
