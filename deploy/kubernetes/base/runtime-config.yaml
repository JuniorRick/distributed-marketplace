apiVersion: v1
kind: ConfigMap
metadata:
  name: marketplace-runtime
data:
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  OIDC_ISSUER_URI: http://localhost:8088/auth/realms/marketplace
  OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/marketplace/protocol/openid-connect/certs
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.0.1-SNAPSHOT
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
