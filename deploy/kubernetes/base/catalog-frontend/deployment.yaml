apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-frontend
  labels:
    app.kubernetes.io/name: catalog-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: catalog-frontend
      containers:
        - name: catalog-frontend
          image: marketplace/catalog-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
