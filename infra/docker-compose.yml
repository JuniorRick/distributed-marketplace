name: distributed-marketplace

services:
  catalog-db:
    image: postgres:17-alpine
    container_name: marketplace-catalog-db
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - catalog-db-data:/var/lib/postgresql/data

volumes:
  catalog-db-data:
