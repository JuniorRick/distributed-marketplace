name: distributed-marketplace

services:
  marketplace-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U marketplace -d marketplace" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - marketplace-db-data:/var/lib/postgresql/data

  marketplace-db-init:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: marketplace
    command:
      - psql
      - -h
      - marketplace-db
      - -U
      - marketplace
      - -d
      - marketplace
      - -v
      - ON_ERROR_STOP=1
      - -c
      - CREATE SCHEMA IF NOT EXISTS catalog; CREATE SCHEMA IF NOT EXISTS cart; CREATE SCHEMA IF NOT EXISTS orders; CREATE SCHEMA IF NOT EXISTS inventory; CREATE SCHEMA IF NOT EXISTS payments; CREATE SCHEMA IF NOT EXISTS notifications; CREATE SCHEMA IF NOT EXISTS customers;
    depends_on:
      marketplace-db:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: marketplace
      RABBITMQ_DEFAULT_PASS: marketplace
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - marketplace-rabbitmq-data:/var/lib/rabbitmq

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: >-
        INTERNAL://:29092,
        EXTERNAL://:9092,
        CONTROLLER://:29093

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:29092,
        EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - marketplace-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list
      interval: 10s
      timeout: 10s
      retries: 12

  catalog-backend:
    image: distributed-marketplace-catalog-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: catalog
    environment:
      CATALOG_DB_URL: jdbc:postgresql://marketplace-db:5432/marketplace?currentSchema=catalog
      CATALOG_DB_USER: marketplace
      CATALOG_DB_PASSWORD: marketplace
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_SERVICE_NAME: catalog
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.0.1-SNAPSHOT
    ports:
      - "${CATALOG_API_PORT:-8081}:8081"
    depends_on:
      marketplace-db:
        condition: service_healthy
      marketplace-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  cart-backend:
    image: distributed-marketplace-cart-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: cart
    environment:
      CART_DB_URL: jdbc:postgresql://marketplace-db:5432/marketplace?currentSchema=cart
      CART_DB_USER: marketplace
      CART_DB_PASSWORD: marketplace
      CATALOG_BASE_URL: http://catalog-backend:8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: marketplace
      RABBITMQ_PASSWORD: marketplace
      OTEL_SERVICE_NAME: cart
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.0.1-SNAPSHOT
    ports:
      - "${CART_API_PORT:-8082}:8082"
    depends_on:
      marketplace-db:
        condition: service_healthy
      marketplace-db-init:
        condition: service_completed_successfully
      catalog-backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  orders-backend:
    image: distributed-marketplace-orders-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: orders
    environment:
      ORDERS_DB_URL: jdbc:postgresql://marketplace-db:5432/marketplace?currentSchema=orders
      ORDERS_DB_USER: marketplace
      ORDERS_DB_PASSWORD: marketplace
      CART_BASE_URL: http://cart-backend:8082
      SAGA_RECONCILIATION_INITIAL_DELAY: ${SAGA_RECONCILIATION_INITIAL_DELAY:-30s}
      SAGA_RECONCILIATION_FIXED_DELAY: ${SAGA_RECONCILIATION_FIXED_DELAY:-30s}
      SAGA_RECONCILIATION_STALE_AFTER: ${SAGA_RECONCILIATION_STALE_AFTER:-1m}
      SAGA_RECONCILIATION_MAX_ATTEMPTS: ${SAGA_RECONCILIATION_MAX_ATTEMPTS:-5}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: marketplace
      RABBITMQ_PASSWORD: marketplace
      OTEL_SERVICE_NAME: orders
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.0.1-SNAPSHOT
    ports:
      - "${ORDERS_API_PORT:-8083}:8083"
    depends_on:
      marketplace-db:
        condition: service_healthy
      marketplace-db-init:
        condition: service_completed_successfully
      cart-backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  inventory-backend:
    image: distributed-marketplace-inventory-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: inventory
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://marketplace-db:5432/marketplace?currentSchema=inventory
      INVENTORY_DB_USER: marketplace
      INVENTORY_DB_PASSWORD: marketplace
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: marketplace
      RABBITMQ_PASSWORD: marketplace
      OTEL_SERVICE_NAME: inventory
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.0.1-SNAPSHOT
    ports:
      - "${INVENTORY_API_PORT:-8084}:8084"
    depends_on:
      marketplace-db:
        condition: service_healthy
      marketplace-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payments-backend:
    image: distributed-marketplace-payments-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: payments
    environment:
      PAYMENTS_DB_URL: jdbc:postgresql://marketplace-db:5432/marketplace?currentSchema=payments
      PAYMENTS_DB_USER: marketplace
      PAYMENTS_DB_PASSWORD: marketplace
      PAYMENT_SIMULATOR_OUTCOME: ${PAYMENT_SIMULATOR_OUTCOME:-CAPTURED}
      PAYMENT_SIMULATOR_REFUND_OUTCOME: ${PAYMENT_SIMULATOR_REFUND_OUTCOME:-REFUNDED}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: marketplace
      RABBITMQ_PASSWORD: marketplace
      OTEL_SERVICE_NAME: payments
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.0.1-SNAPSHOT
    ports:
      - "${PAYMENTS_API_PORT:-8085}:8085"
    depends_on:
      marketplace-db:
        condition: service_healthy
      marketplace-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notifications-backend:
    image: distributed-marketplace-notifications-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: notifications
    environment:
      NOTIFICATIONS_DB_URL: jdbc:postgresql://marketplace-db:5432/marketplace?currentSchema=notifications
      NOTIFICATIONS_DB_USER: marketplace
      NOTIFICATIONS_DB_PASSWORD: marketplace
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: marketplace
      RABBITMQ_PASSWORD: marketplace
      OTEL_SERVICE_NAME: notifications
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.0.1-SNAPSHOT
    ports:
      - "${NOTIFICATIONS_API_PORT:-8086}:8086"
    depends_on:
      marketplace-db:
        condition: service_healthy
      marketplace-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  customers-backend:
    image: distributed-marketplace-customers-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: customers
    environment:
      CUSTOMERS_DB_URL: jdbc:postgresql://marketplace-db:5432/marketplace?currentSchema=customers
      CUSTOMERS_DB_USER: marketplace
      CUSTOMERS_DB_PASSWORD: marketplace
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: marketplace
      RABBITMQ_PASSWORD: marketplace
      OTEL_SERVICE_NAME: customers
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.0.1-SNAPSHOT
    ports:
      - "${CUSTOMERS_API_PORT:-8087}:8087"
    depends_on:
      marketplace-db:
        condition: service_healthy
      marketplace-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  catalog-frontend:
    image: distributed-marketplace-catalog-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        SERVICE: catalog
    ports:
      - "${CATALOG_UI_PORT:-5173}:80"
    depends_on:
      catalog-backend:
        condition: service_started
      cart-backend:
        condition: service_started

  cart-frontend:
    image: distributed-marketplace-cart-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        SERVICE: cart
    ports:
      - "${CART_UI_PORT:-5174}:80"
    depends_on:
      cart-backend:
        condition: service_started
      orders-backend:
        condition: service_started

  orders-frontend:
    image: distributed-marketplace-orders-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        SERVICE: orders
    ports:
      - "${ORDERS_UI_PORT:-5175}:80"
    depends_on:
      orders-backend:
        condition: service_started

  loki:
    image: grafana/loki:3.4.1
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yml:ro
    ports:
      - "4318:4318"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ch13-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

volumes:
  marketplace-db-data:
  marketplace-rabbitmq-data:
  marketplace-kafka-data:
